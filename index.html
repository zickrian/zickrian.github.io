<style>
  :root {
    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.74);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    /* One card's side: as big as fits, two side by side (or stacked on a phone) on one screen. */
    --card: min(420px, 42vw, 74dvh);
  }
  * { box-sizing: border-box; }
  /* One screen, nothing to scroll. */
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    height: 100vh;
    height: 100dvh;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: #0b1f18 url("/assets/forest.webp") center / cover no-repeat;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 50%, rgba(4, 18, 12, 0.05), rgba(4, 18, 12, 0.45));
  }
  .sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .doors { position: relative; display: flex; gap: 24px; }
  .door {
    width: var(--card); aspect-ratio: 1; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column;
    padding: 12px; border-radius: 28px;
    color: inherit; text-decoration: none; outline: none;
    /* Isle's light glass: clear, blurred, a rim catching the light from above. */
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.08) 55%, rgba(255, 255, 255, 0.06));
    -webkit-backdrop-filter: blur(28px) saturate(1.6);
    backdrop-filter: blur(28px) saturate(1.6);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.4),
      inset 0 0 0 1px rgba(255, 255, 255, 0.18),
      0 1px 2px rgba(0, 0, 0, 0.25),
      0 24px 60px -24px rgba(0, 0, 0, 0.65);
    transition: transform 500ms var(--ease-spring), box-shadow 400ms var(--ease-out);
  }
  .door:hover, .door:focus-visible {
    transform: translateY(-6px);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.55),
      inset 0 0 0 1px rgba(255, 255, 255, 0.3),
      0 1px 2px rgba(0, 0, 0, 0.25),
      0 34px 70px -24px rgba(0, 0, 0, 0.75);
  }
  .door:focus-visible { box-shadow: inset 0 0 0 2px #fff, 0 34px 70px -24px rgba(0, 0, 0, 0.75); }

  .banner {
    flex: 1 1 0; height: 0; min-height: 0; width: 100%;
    display: block; object-fit: cover; border-radius: 18px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1), 0 8px 24px -14px rgba(0, 0, 0, 0.7);
  }
  .meta { display: flex; align-items: center; gap: 12px; padding: 14px 6px 4px; }
  .icon { width: 42px; height: 42px; flex: none; border-radius: 50%; display: block; }
  .icon.face { border-radius: 12px; object-fit: cover; box-shadow: 0 0 0 1.5px rgba(255, 255, 255, 0.75), 0 4px 10px -4px rgba(0, 0, 0, 0.5); }
  .icon.bot { filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.35)); }
  .text { flex: 1; min-width: 0; }
  .door h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.01em; line-height: 1.2; }
  .door p { margin: 3px 0 0; font-size: 14px; line-height: 1.35; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arrow {
    width: 36px; height: 36px; flex: none; border-radius: 50%;
    display: grid; place-items: center;
    color: #0d2a1f; background: rgba(255, 255, 255, 0.92);
    box-shadow: 0 6px 16px -8px rgba(0, 0, 0, 0.6);
    transition: transform 500ms var(--ease-spring);
  }
  .arrow svg { width: 16px; height: 16px; }
  .door:hover .arrow { transform: translateX(3px); }
  .door:hover .arrow.out { transform: translate(2px, -2px); }

  /* A phone: the two cards one above the other, still on one screen. */
  @media (max-width: 720px) {
    body { background-image: url("/assets/forest-960.webp"); }
    :root { --card: min(340px, calc(100vw - 32px), calc((100dvh - 64px) / 2)); }
    .doors { flex-direction: column; gap: 16px; }
    .door { border-radius: 24px; padding: 10px; }
    .meta { padding: 10px 4px 2px; }
    .door p { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 13.5px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .door, .arrow { transition: none; }
    .door:hover { transform: none; }
  }
</style>

<body>
  <h1 class="sr-only">Firdaus Khotibul Zickrian: portfolio and Isle</h1>
  <nav class="doors" aria-label="Where to go">
    <a class="door" href="https://www.zickrian.dev/">
      <img class="banner" src="/assets/banner-portfolio.webp" alt="My portfolio’s banner: a beam of light over a mountain valley full of flowers" width="1440" height="1200">
      <div class="meta">
        <img class="icon face" src="/assets/profile.webp" alt="" width="42" height="42">
        <div class="text">
          <h2>Portfolio</h2>
          <p>AI &amp; Machine Learning Engineer</p>
        </div>
        <span class="arrow out" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 11 11 5M6 5h5v5"/></svg></span>
      </div>
    </a>
    <a class="door" href="/isle-site/">
      <img class="banner" src="/assets/banner-isle.webp" alt="Isle’s glass island showing a song with its synced lyrics" width="1440" height="1200">
      <div class="meta">
        <img class="icon bot" src="/assets/bot.png" alt="" width="42" height="42">
        <div class="text">
          <h2>Isle</h2>
          <p>A dynamic island for GNOME</p>
        </div>
        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg></span>
      </div>
    </a>
  </nav>
